plugins { id 'com.android.application' }

def repositoryRoot = rootProject.projectDir.toPath().resolve('../..').normalize().toFile()
def signingFile = new File(repositoryRoot, 'private/android-signing/signing.properties')
def releaseSigning = new Properties()
if (signingFile.exists()) signingFile.withInputStream { releaseSigning.load(it) }
def serviceOrigin = providers.gradleProperty('nuteOrigin').getOrElse('')
if (!(serviceOrigin ==~ /https:\/\/([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,63}/))
    throw new GradleException('Set -PnuteOrigin=https://your-domain (no path, credentials or port)')
def fixtureOrigin = providers.gradleProperty('nuteTestOrigin').getOrElse(serviceOrigin)
if (fixtureOrigin != serviceOrigin && !(fixtureOrigin ==~ /http:\/\/127\.0\.0\.1:[0-9]{4,5}/))
    throw new GradleException('Test origin must be localhost with an explicit port')

android {
    namespace 'org.nutenotes.app'
    compileSdk 36
    defaultConfig {
        applicationId 'org.nutenotes.app'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.5.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (!releaseSigning.isEmpty()) {
                storeFile new File(repositoryRoot, 'private/android-signing/nute-release.p12')
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false; shrinkResources false; buildConfigField 'String', 'SERVICE_ORIGIN', '"' + serviceOrigin + '"' }
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug'; buildConfigField 'String', 'SERVICE_ORIGIN', '"' + fixtureOrigin + '"' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/nute-assets')
    sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/nute-res')
    testOptions { unitTests.returnDefaultValues = true }
    buildFeatures { buildConfig true }
}

tasks.register('copyNuteAssets') {
    inputs.dir new File(repositoryRoot, 'public/assets')
    inputs.file new File(repositoryRoot, 'public/app.html')
    inputs.file new File(repositoryRoot, 'public/favicon.png')
    inputs.file file('src/main/native-bridge.js')
    outputs.dir layout.buildDirectory.dir('generated/nute-assets')
    outputs.dir layout.buildDirectory.dir('generated/nute-res')
    doLast {
        def destination = layout.buildDirectory.dir('generated/nute-assets').get().asFile
        destination.mkdirs()
        copy { from new File(repositoryRoot, 'public/assets'); into new File(destination, 'assets'); exclude '**/*.php' }
        copy { from new File(repositoryRoot, 'public/favicon.png'); into destination }
        copy { from file('src/main/native-bridge.js'); into new File(destination, 'assets') }
        def html = new File(repositoryRoot, 'public/app.html').getText('UTF-8')
        html = html.replace('<head>', '<head>\n  <script src="assets/native-bridge.js"></script>')
        new File(destination, 'index.html').setText(html, 'UTF-8')
        def drawable = layout.buildDirectory.dir('generated/nute-res/drawable-nodpi').get().asFile
        drawable.mkdirs()
        copy { from new File(repositoryRoot, 'public/favicon.png'); into drawable; rename { 'nute_logo.png' } }
    }
}
tasks.named('preBuild').configure { dependsOn 'copyNuteAssets' }
dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'androidx.work:work-runtime:2.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
